# Forgejo Runner 13. Jobs with `runs-on: docker` run on the DinD service.
# `network: host` is the DinD container's network namespace, so jobs reach
# dockerd at tcp://docker:2376. The bridge network cannot resolve that name.
# `docker_host: "-"` keeps the runner on DOCKER_HOST from Compose and does
# not mount a socket. Job certs come from the dind-certs volume.

log:
  level: info

runner:
  file: /data/.runner
  capacity: 1
  timeout: 3h
  shutdown_timeout: 0s
  insecure: false
  fetch_timeout: 5s
  fetch_interval: 2s
  labels:
    - "docker:docker://code.forgejo.org/oci/node:22-bookworm"
  envs:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client

cache:
  enabled: true
  dir: /data/.cache

container:
  network: host
  privileged: true
  options: "-v /certs/client:/certs/client:ro"
  valid_volumes:
    - /certs/client
  docker_host: "-"
  force_pull: false
  force_rebuild: false
